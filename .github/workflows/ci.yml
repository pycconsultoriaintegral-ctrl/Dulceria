name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Instalar dependencias del servidor
        run: npm ci
      - name: Pruebas del servidor (permisos, inventario, migraciones, importación…)
        run: npm test
      - name: Instalar dependencias de la interfaz
        run: npm --prefix web ci
      - name: Compilar la interfaz
        run: npm --prefix web run build
